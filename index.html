<style>

<script>
const L={
ru:{
subtitle:"Моё видение будущего энергетики Ирландии: избыточная ветровая электроэнергия, возможная приливная генерация и зелёный водород.",
status:"Независимая исследовательская концепция — не готовый инженерный проект и не инвестиционное предложение.",
footer:"Независимая концепция. Все расчёты — сценарии.",
tabs:["Обзор","Калькулятор","Хронология","Рынок","Прототип","Аналитика","Риски","Контакты"],
overview:`<div class="card highlight"><div class="eyebrow">Главная идея</div><h2>Использовать избыток возобновляемой электроэнергии вместо его потери</h2><p>Я предлагаю исследовать, может ли Ирландия превращать часть доступной избыточной электроэнергии ветропарков в зелёный водород. В будущем к ветру можно добавить приливную энергетику, если её техническая и экономическая эффективность подтвердится.</p><p><strong>Это моё видение возможной энергосистемы, а не утверждение, что такая система уже построена или обязательно станет выгодной.</strong></p></div><div class="grid"><div class="card"><div class="eyebrow">Источник</div><h3>Ветер</h3><p>Исследуем часы, когда производство ветровой энергии ограничивается или её рыночная стоимость низкая. Ограниченная генерация не означает бесплатную энергию: важны договор, доступ к сети и условия поставки.</p></div><div class="card"><div class="eyebrow">Дополнительная гипотеза</div><h3>Приливы и отливы</h3><p>Возможный второй источник энергии, который требует отдельной оценки площадок, оборудования, разрешений и стоимости. Это направление исследования, а не готовая часть проекта.</p></div><div class="card"><div class="eyebrow">Преобразование</div><h3>Электролиз</h3><p>Электролизёр использует электричество и очищенную воду для производства водорода. Его себестоимость зависит не только от цены электричества, но и от числа часов работы, вложений и обслуживания.</p></div><div class="card"><div class="eyebrow">Применение</div><h3>Там, где нужен H₂</h3><p>Промышленность, отдельные виды транспорта, энергетическое хранение. Подмешивание в природный газ для домов — только пример, требующий разрешений и проверки совместимости оборудования.</p></div></div><div class="card"><h2>Что я НЕ утверждаю</h2><p>Я не утверждаю, что электричество по €0,001/кВт·ч доступно сегодня, что ветер будет единственным источником энергии в Ирландии, что 20% водорода разрешено подмешивать в любую газовую сеть или что проект уже имеет финансирование, контракты и покупателей.</p><p><strong>Что я предлагаю:</strong> проверить будущие сценарии, в которых доля ветровой генерации возрастает, в отдельные часы электричество становится очень дешёвым и производство водорода может иметь смысл.</p></div>`,
calculator:`<div class="card"><h2>Калькулятор себестоимости водорода</h2><p>Меняй цену электроэнергии, число рабочих часов и стоимость оборудования. Расчёт показывает, как меняется <strong>себестоимость производства</strong> водорода. Это не гарантированная цена продажи и не предложение поставщика.</p><div class="grid"><label class="field">Цена электроэнергии, €/кВт·ч<input id="price" type="number" min="0" max="1" step="0.001" value="0.001"></label><label class="field">Работа электролизёра, часов/год<input id="hours" type="number" min="100" max="8760" step="100" value="3500"></label><label class="field">Мощность электролизёра, кВт<input id="power" type="number" min="10" max="100000" step="100" value="1000"></label><label class="field">Потребление, кВт·ч/кг H₂<input id="specific" type="number" min="40" max="90" step="1" value="52"></label><label class="field">Инвестиции, € на кВт мощности<input id="capex" type="number" min="100" max="10000" step="100" value="2000"></label><label class="field">Постоянные расходы, % инвестиций/год<input id="opex" type="number" min="0" max="20" step="0.5" value="4"></label><label class="field">Срок службы, лет<input id="life" type="number" min="1" max="40" step="1" value="15"></label><label class="field">Ставка дисконтирования, %<input id="rate" type="number" min="0" max="30" step="1" value="8"></label></div><p class="note">Начальная цена €0,001/кВт·ч — твой гипотетический сценарий очень дешёвого будущего электричества, а не подтверждённая рыночная котировка.</p><div id="results" class="grid" aria-live="polite"></div><p class="note">В расчёт не включены хранение, сжатие, доставка, сетевые сборы, налоги, вода, дополнительные капитальные затраты и замена оборудования. Реальная себестоимость может быть выше.</p></div>`,
timeline:`<div class="card"><h2>Хронология проверки концепции</h2><p>Здесь этапы исследований, а не обещания по календарным датам.</p></div><div class="steps"><div class="card"><h3>Проверить данные</h3><p>Изучить почасовые ограничения ветровой генерации, рыночные цены, ночные периоды и доступность подключения. Ночь сама по себе не гарантирует избыток энергии.</p></div><div class="card"><h3>Проверить экономику</h3><p>Сравнить цену электроэнергии, часы работы, стоимость электролизёра и цену водорода с альтернативными технологиями.</p></div><div class="card"><h3>Найти применение</h3><p>Поговорить с потенциальными покупателями H₂. Проверить, нужен ли им водород, какого качества, объёма и по какой цене.</p></div><div class="card"><h3>Подготовить инженерное исследование</h3><p>Только после первых подтверждений — площадка, партнёры, безопасность, разрешения и технико-экономическое обоснование.</p></div><div class="card"><h3>Решение о пилоте</h3><p>Пилот возможен только если результаты предыдущих этапов положительны. Даты и бюджет пока не заявлены.</p></div></div>`,
market:`<div class="card"><h2>Рынок: кому может быть нужен водород?</h2><p>Рынок не равен всему количеству домов Ирландии. Сначала нужно найти конкретную задачу, которую водород решает лучше альтернатив.</p></div><div class="grid"><div class="card"><h3>Промышленность</h3><p>Потенциальные потребители водорода как сырья или топлива. Важны постоянство поставок, качество и стоимость.</p></div><div class="card"><h3>Транспорт</h3><p>Отдельные тяжёлые транспортные применения, если они экономически оправданы по сравнению с прямой электрификацией.</p></div><div class="card"><h3>Энергетика</h3><p>Возможное длительное или сезонное хранение энергии, если аккумуляторы и другие решения не подходят.</p></div><div class="card"><h3>Газовое отопление домов</h3><p>Иллюстративный пример подмешивания. 20% H₂ по объёму — около 7% энергии смеси и ориентировочно 6–7% сокращения прямых выбросов CO₂ на единицу тепла. Нужны проверки оборудования и разрешения.</p></div></div><div class="card"><h3>От чего зависит цена продажи?</h3><p>Себестоимость водорода может формироваться независимо от цены газа, если используется электричество из ветра. Но покупатель сравнивает водород с другими видами топлива, поэтому рыночная цена продажи не становится автоматически независимой от газового рынка.</p></div>`,
prototype:`<div class="card"><h2>Как мог бы выглядеть исследовательский прототип</h2><p><strong>Ветрогенерация → доступная электроэнергия → электролизёр → очистка и хранение H₂ → подтверждённый потребитель.</strong></p><p>Приливная генерация рассматривается как потенциальное дополнительное направление. Аккумулятор BESS может помогать управлять режимами работы, но его необходимость должна быть доказана расчётом.</p></div><div class="grid"><div class="card"><h3>Что нужно измерять</h3><ul><li>Реальную цену и объём доступной электроэнергии</li><li>Часы работы и расход энергии на килограмм H₂</li><li>Затраты на воду, сжатие, хранение и обслуживание</li><li>Потери энергии и фактические выбросы</li></ul></div><div class="card"><h3>Чего пока нет</h3><ul><li>Подтверждённой площадки и схемы подключения</li><li>Согласованного инженерного проекта</li><li>Разрешений на водородную инфраструктуру</li><li>Подписанного договора продажи H₂</li></ul></div></div>`,
analytics:`<div class="card"><h2>Аналитика: почему важны не только дешёвые киловатт-часы</h2><p>Даже если электричество почти бесплатное, электролизёр нужно купить и обслуживать. Если он работает мало часов, стоимость оборудования приходится распределять на небольшое количество произведённого водорода.</p><p>Поэтому проверяем сразу три величины: <strong>цену электроэнергии, число рабочих часов и полную стоимость водорода</strong>.</p><div class="grid"><div class="result"><small>Электричество по €0,001/кВт·ч</small><div class="metric">€0,052/кг</div><small>Только электрическая составляющая при 52 кВт·ч/кг</small></div><div class="result"><small>Электричество по €0,01/кВт·ч</small><div class="metric">€0,52/кг</div><small>Только электрическая составляющая</small></div><div class="result"><small>Электричество по €0,04/кВт·ч</small><div class="metric">€2,08/кг</div><small>Только электрическая составляющая</small></div></div><p class="note">Это не итоговая себестоимость: капитальные и прочие расходы рассчитываются в калькуляторе. Нулевая или отрицательная оптовая цена также не означает нулевую стоимость поставки на объект.</p></div>`,
risks:`<div class="card"><h2>Главные риски и открытые вопросы</h2><ul><li><strong>Доступ к энергии:</strong> будет ли ограниченная ветровая генерация физически и юридически доступна для электролизёра?</li><li><strong>Цена:</strong> сможет ли проект покупать энергию по €0,001/кВт·ч с учётом договоров и сетевых платежей? Это гипотеза, не факт.</li><li><strong>Загрузка:</strong> достаточно ли часов в году для окупаемости оборудования?</li><li><strong>Спрос:</strong> кто купит водород и по какой цене?</li><li><strong>Инфраструктура:</strong> сколько стоят вода, сжатие, хранение, доставка и безопасность?</li><li><strong>Приливная энергетика:</strong> подтвердятся ли доступность ресурсов и конкурентоспособность технологии?</li><li><strong>Регулирование:</strong> какие разрешения необходимы для производства, хранения и возможного подмешивания?</li><li><strong>Альтернативы:</strong> не выгоднее ли прямое потребление электричества или аккумуляторы?</li></ul><p><strong>Вывод:</strong> проект остаётся открытой исследовательской гипотезой. Отрицательный результат расчётов — тоже полезный результат.</p></div>`,
contact:`<div class="card"><h2>О проекте и контактах</h2><p><strong>Hydrogen Future Ireland</strong> — независимое авторское видение возможного использования избыточной возобновляемой электроэнергии для производства зелёного водорода в Ирландии.</p><p>Проект не заявляет о партнёрстве, финансировании или официальном одобрении со стороны университетов, органов власти, энергетических компаний или операторов сетей.</p><p>Для обсуждения концепции, исходных данных и возможных исследований используйте <a href="https://github.com/gennadjevich0/hydrogenfuture">репозиторий проекта на GitHub</a>.</p></div>`
},
en:{
subtitle:"An independent vision for Ireland's energy future: surplus wind electricity, possible tidal generation and green hydrogen.",
status:"Independent research concept — not a completed engineering design or investment offer.",
footer:"Independent concept. All calculations are scenarios.",
tabs:["Overview","Calculator","Roadmap","Market","Prototype","Analysis","Risks","Contact"],
overview:`<div class="card highlight"><div class="eyebrow">Core vision</div><h2>Use available surplus renewable electricity rather than lose its potential value</h2><p>I propose exploring whether Ireland could convert some available surplus wind electricity into green hydrogen. In the longer term, tidal generation could be assessed as an additional source, subject to technical and economic feasibility.</p><p><strong>This is my vision of a possible energy system, not a claim that the system already exists or will necessarily be profitable.</strong></p></div><div class="grid"><div class="card"><h3>Wind</h3><p>Explore periods of curtailed wind output and low electricity prices. Curtailment does not automatically mean free or deliverable power.</p></div><div class="card"><h3>Tidal energy</h3><p>A possible additional research pathway requiring separate assessment of sites, technology, permits and costs.</p></div><div class="card"><h3>Electrolysis</h3><p>Convert electricity and treated water into hydrogen. Costs depend on electricity, operating hours, capital and maintenance.</p></div><div class="card"><h3>Applications</h3><p>Potential industrial, transport and energy uses. Domestic gas blending is one possible example, not the core business promise.</p></div></div><div class="card"><h2>What I am not claiming</h2><p>I am not claiming electricity is currently available at €0.001/kWh, that wind will monopolise Ireland's electricity market, that 20% H₂ blending is universally authorised, or that funding, contracts and buyers have been secured.</p><p><strong>The proposal:</strong> test future scenarios where wind generation grows and electricity becomes very cheap during certain hours, potentially supporting hydrogen production.</p></div>`,
calculator:`<div class="card"><h2>Hydrogen production cost calculator</h2><p>Adjust electricity prices, operating hours and equipment costs. Results estimate <strong>production cost</strong>, not a guaranteed selling price.</p><div class="grid"><label class="field">Electricity price, €/kWh<input id="price" type="number" min="0" max="1" step="0.001" value="0.001"></label><label class="field">Electrolyser hours/year<input id="hours" type="number" min="100" max="8760" step="100" value="3500"></label><label class="field">Electrolyser power, kW<input id="power" type="number" min="10" max="100000" step="100" value="1000"></label><label class="field">Electricity use, kWh/kg H₂<input id="specific" type="number" min="40" max="90" step="1" value="52"></label><label class="field">Installed CAPEX, €/kW<input id="capex" type="number" min="100" max="10000" step="100" value="2000"></label><label class="field">Fixed annual OPEX, % of CAPEX<input id="opex" type="number" min="0" max="20" step="0.5" value="4"></label><label class="field">Lifetime, years<input id="life" type="number" min="1" max="40" step="1" value="15"></label><label class="field">Discount rate, %<input id="rate" type="number" min="0" max="30" step="1" value="8"></label></div><p class="note">The initial €0.001/kWh is a hypothetical future-price scenario, not a verified market quote.</p><div id="results" class="grid" aria-live="polite"></div><p class="note">Excludes compression, storage, delivery, grid charges, taxes, water and replacement equipment. Actual costs may be higher.</p></div>`,
timeline:`<div class="card"><h2>Research roadmap — not fixed delivery dates</h2></div><div class="steps"><div class="card"><h3>Verify data</h3><p>Review hourly curtailment, electricity prices, nighttime periods and connection constraints. Nighttime does not guarantee surplus wind.</p></div><div class="card"><h3>Test economics</h3><p>Model power prices, operating hours, equipment cost and alternatives.</p></div><div class="card"><h3>Identify demand</h3><p>Ask potential customers about hydrogen specifications, volume and price.</p></div><div class="card"><h3>Engineering feasibility</h3><p>Assess site, partners, safety, permits and project economics.</p></div><div class="card"><h3>Pilot decision</h3><p>Consider a pilot only if earlier stages justify it. No dates or budget are promised.</p></div></div>`,
market:`<div class="card"><h2>Potential hydrogen markets</h2><p>Not every Irish home is automatically a hydrogen customer. The first task is to identify uses where hydrogen offers value over alternatives.</p></div><div class="grid"><div class="card"><h3>Industry</h3><p>Potential feedstock or fuel users, subject to supply reliability, quality and price.</p></div><div class="card"><h3>Transport</h3><p>Selected heavy transport applications where hydrogen can compete with electrification.</p></div><div class="card"><h3>Energy storage</h3><p>Potential long-duration or seasonal storage where alternatives are less suitable.</p></div><div class="card"><h3>Gas-heated homes</h3><p>An illustrative blending case only. A 20 vol% H₂ blend delivers about 7% of energy and roughly 6–7% lower direct CO₂ per unit of heat, subject to compatibility and approval.</p></div></div><div class="card"><h3>What sets selling prices?</h3><p>Production cost can be driven by wind electricity rather than natural gas. Selling prices still depend on customers, alternative fuels and the wider market.</p></div>`,
prototype:`<div class="card"><h2>Possible research prototype</h2><p><strong>Wind generation → available electricity → electrolyser → H₂ treatment and storage → confirmed customer.</strong></p><p>Tidal generation is a possible future research option. Battery storage (BESS) should be included only if the economics justify it.</p></div><div class="grid"><div class="card"><h3>Measurements</h3><ul><li>Actual electricity availability and cost</li><li>Operating hours and kWh/kg H₂</li><li>Water, compression, storage and maintenance</li><li>Energy losses and lifecycle emissions</li></ul></div><div class="card"><h3>Not yet established</h3><ul><li>Site and grid connection</li><li>Approved engineering design</li><li>Hydrogen safety permits</li><li>Binding H₂ offtake agreement</li></ul></div></div>`,
analytics:`<div class="card"><h2>Why cheap electricity is not enough</h2><p>Even with nearly free electricity, an electrolyser must be purchased and maintained. Fewer operating hours spread fixed costs across fewer kilograms of hydrogen.</p><div class="grid"><div class="result"><small>Power at €0.001/kWh</small><div class="metric">€0.052/kg</div><small>Electricity component only, at 52 kWh/kg</small></div><div class="result"><small>Power at €0.01/kWh</small><div class="metric">€0.52/kg</div><small>Electricity component only</small></div><div class="result"><small>Power at €0.04/kWh</small><div class="metric">€2.08/kg</div><small>Electricity component only</small></div></div><p class="note">These are not total production costs. The calculator includes simplified capital and operating costs. Zero or negative wholesale power prices do not guarantee zero delivery costs.</p></div>`,
risks:`<div class="card"><h2>Key risks and open questions</h2><ul><li><strong>Access:</strong> can curtailed wind energy be contracted and delivered to an electrolyser?</li><li><strong>Price:</strong> could €0.001/kWh be achieved after grid and contract costs? This is a hypothesis.</li><li><strong>Utilisation:</strong> will there be enough operating hours?</li><li><strong>Demand:</strong> who will buy hydrogen and at what price?</li><li><strong>Infrastructure:</strong> what will water, compression, storage, transport and safety cost?</li><li><strong>Tidal power:</strong> can it become technically and commercially viable?</li><li><strong>Regulation:</strong> what permits are required?</li><li><strong>Alternatives:</strong> could direct electrification or batteries perform better?</li></ul><p><strong>Conclusion:</strong> this is an open research hypothesis. An unfavourable calculation is still a useful finding.</p></div>`,
contact:`<div class="card"><h2>About and contact</h2><p><strong>Hydrogen Future Ireland</strong> is an independent personal vision for using surplus renewable electricity to produce green hydrogen in Ireland.</p><p>No university, government, utility or network-operator endorsement, funding or partnership is claimed.</p><p>For discussion of the concept and its assumptions, see the <a href="https://github.com/gennadjevich0/hydrogenfuture">project GitHub repository</a>.</p></div>`
}};
let lang='ru',active='overview';const ids=['overview','calculator','timeline','market','prototype','analytics','risks','contact'];
function render(){document.documentElement.lang=lang;const t=L[lang];document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);document.getElementById('enBtn').setAttribute('aria-pressed',lang==='en');document.getElementById('ruBtn').setAttribute('aria-pressed',lang==='ru');document.getElementById('tabs').innerHTML=ids.map((id,i)=>'<button type="button" data-tab="'+id+'" role="tab" aria-selected="'+(active===id)+'">'+t.tabs[i]+'</button>').join('');ids.forEach(id=>{const p=document.getElementById(id);p.innerHTML=t[id];p.classList.toggle('active',id===active)});document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render();document.getElementById(active).scrollIntoView({block:'start',behavior:'smooth'})}));if(active==='calculator'){document.querySelectorAll('#calculator input').forEach(i=>i.addEventListener('input',calculate));calculate()}}
function calculate(){const n=id=>Number(document.getElementById(id).value);const price=n('price'),hours=n('hours'),power=n('power'),spec=n('specific'),capex=n('capex'),opex=n('opex'),life=n('life'),rate=n('rate')/100;const ok=[price,hours,power,spec,capex,opex,life,rate].every(Number.isFinite)&&price>=0&&hours>0&&hours<=8760&&power>0&&spec>0&&capex>=0&&opex>=0&&life>0&&rate>=0;if(!ok){document.getElementById('results').textContent=lang==='ru'?'Проверь введённые значения.':'Please check input values.';return}const kg=power*hours/spec,investment=power*capex,crf=rate===0?1/life:rate/(1-Math.pow(1+rate,-life)),fixed=investment*(crf+opex/100),elec=price*spec,total=elec+fixed/kg;const nf=(v,d=2)=>new Intl.NumberFormat(lang==='ru'?'ru-RU':'en-IE',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);const labels=lang==='ru'?[['Производство H₂, тонн/год',kg/1000],['Электричество, €/кг',elec],['Оборудование и обслуживание, €/кг',fixed/kg],['Расчётная себестоимость, €/кг',total]]:[['H₂ production, tonnes/year',kg/1000],['Electricity, €/kg',elec],['Capital and fixed costs, €/kg',fixed/kg],['Estimated production cost, €/kg',total]];document.getElementById('results').innerHTML=labels.map(([k,v])=>'<div class="result"><small>'+k+'</small><div class="metric">'+nf(v)+'</div></div>').join('')}
document.getElementById('enBtn').addEventListener('click',()=>{lang='en';render()});document.getElementById('ruBtn').addEventListener('click',()=>{lang='ru';render()});render();
</script></body></html>
