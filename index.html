<style>

</style></head><body>
<header><div class="top"><span class="badge">H₂ • IRELAND • INDEPENDENT CONCEPT</span><div class="langs"><button id="enBtn" type="button" aria-pressed="true">EN</button><button id="ruBtn" type="button" aria-pressed="false">RU</button></div></div><h1>Hydrogen Future Ireland</h1><p data-i="subtitle"></p><p><strong data-i="status"></strong></p></header>
<main><nav class="tabs" id="tabs" aria-label="Site sections"></nav><section id="overview" class="panel active"></section><section id="calculator" class="panel"></section><section id="timeline" class="panel"></section><section id="market" class="panel"></section><section id="prototype" class="panel"></section><section id="analytics" class="panel"></section><section id="risks" class="panel"></section><section id="research" class="panel"></section><section id="contact" class="panel"></section></main><footer>Hydrogen Future Ireland · <span data-i="footer"></span></footer>
<script>
const L={
ru:{
subtitle:"Моё видение будущего энергетики Ирландии: избыточная ветровая электроэнергия, возможная приливная генерация и зелёный водород.",
status:"Независимая исследовательская концепция — не готовый инженерный проект и не инвестиционное предложение.",
footer:"Независимая концепция. Все расчёты — сценарии.",
tabs:["Обзор","Калькулятор","Хронология","Рынок","Прототип","Аналитика","Риски","Исследования","Контакты"],
overview:`<div class="card highlight"><div class="eyebrow">Главная идея</div><h2>Использовать избыток возобновляемой электроэнергии вместо его потери</h2><p>Я предлагаю исследовать, может ли Ирландия превращать часть доступной избыточной электроэнергии ветропарков в зелёный водород. В будущем к ветру можно добавить приливную энергетику, если её техническая и экономическая эффективность подтвердится.</p><p><strong>Это моё видение возможной энергосистемы, а не утверждение, что такая система уже построена или обязательно станет выгодной.</strong></p></div><div class="grid"><div class="card"><div class="eyebrow">Источник</div><h3>Ветер</h3><p>Исследуем часы, когда производство ветровой энергии ограничивается или её рыночная стоимость низкая. Ограниченная генерация не означает бесплатную энергию: важны договор, доступ к сети и условия поставки.</p></div><div class="card"><div class="eyebrow">Дополнительная гипотеза</div><h3>Приливы и отливы</h3><p>Возможный второй источник энергии, который требует отдельной оценки площадок, оборудования, разрешений и стоимости. Это направление исследования, а не готовая часть проекта.</p></div><div class="card"><div class="eyebrow">Преобразование</div><h3>Электролиз</h3><p>Электролизёр использует электричество и очищенную воду для производства водорода. Его себестоимость зависит не только от цены электричества, но и от числа часов работы, вложений и обслуживания.</p></div><div class="card"><div class="eyebrow">Применение</div><h3>Там, где нужен H₂</h3><p>Промышленность, отдельные виды транспорта, энергетическое хранение. Подмешивание в природный газ для домов — только пример, требующий разрешений и проверки совместимости оборудования.</p></div></div><div class="card"><h2>Что я НЕ утверждаю</h2><p>Я не утверждаю, что электричество по €0,001/кВт·ч доступно сегодня, что ветер будет единственным источником энергии в Ирландии, что 20% водорода разрешено подмешивать в любую газовую сеть или что проект уже имеет финансирование, контракты и покупателей.</p><p><strong>Что я предлагаю:</strong> проверить будущие сценарии, в которых доля ветровой генерации возрастает, в отдельные часы электричество становится очень дешёвым и производство водорода может иметь смысл.</p></div>`,
calculator:`<div class="card"><h2>Калькулятор себестоимости водорода</h2><p>Меняй цену электроэнергии, число рабочих часов и стоимость оборудования. Расчёт показывает, как меняется <strong>себестоимость производства</strong> водорода. Это не гарантированная цена продажи и не предложение поставщика.</p><div class="grid"><label class="field">Цена электроэнергии, €/кВт·ч<input id="price" type="number" min="0" max="1" step="0.001" value="0.001"></label><label class="field">Работа электролизёра, часов/год<input id="hours" type="number" min="100" max="8760" step="100" value="3500"></label><label class="field">Мощность электролизёра, кВт<input id="power" type="number" min="10" max="100000" step="100" value="1000"></label><label class="field">Потребление, кВт·ч/кг H₂<input id="specific" type="number" min="40" max="90" step="1" value="52"></label><label class="field">Инвестиции, € на кВт мощности<input id="capex" type="number" min="100" max="10000" step="100" value="2000"></label><label class="field">Постоянные расходы, % инвестиций/год<input id="opex" type="number" min="0" max="20" step="0.5" value="4"></label><label class="field">Срок службы, лет<input id="life" type="number" min="1" max="40" step="1" value="15"></label><label class="field">Ставка дисконтирования, %<input id="rate" type="number" min="0" max="30" step="1" value="8"></label></div><p class="note">Начальная цена €0,001/кВт·ч — твой гипотетический сценарий очень дешёвого будущего электричества, а не подтверждённая рыночная котировка.</p><div id="results" class="grid" aria-live="polite"></div><p class="note">В расчёт не включены хранение, сжатие, доставка, сетевые сборы, налоги, вода, дополнительные капитальные затраты и замена оборудования. Реальная себестоимость может быть выше.</p></div>`,
timeline:`<div class="card"><h2>Хронология проверки концепции</h2><p>Здесь этапы исследований, а не обещания по календарным датам.</p></div><div class="steps"><div class="card"><h3>Проверить данные</h3><p>Изучить почасовые ограничения ветровой генерации, рыночные цены, ночные периоды и доступность подключения. Ночь сама по себе не гарантирует избыток энергии.</p></div><div class="card"><h3>Проверить экономику</h3><p>Сравнить цену электроэнергии, часы работы, стоимость электролизёра и цену водорода с альтернативными технологиями.</p></div><div class="card"><h3>Найти применение</h3><p>Поговорить с потенциальными покупателями H₂. Проверить, нужен ли им водород, какого качества, объёма и по какой цене.</p></div><div class="card"><h3>Подготовить инженерное исследование</h3><p>Только после первых подтверждений — площадка, партнёры, безопасность, разрешения и технико-экономическое обоснование.</p></div><div class="card"><h3>Решение о пилоте</h3><p>Пилот возможен только если результаты предыдущих этапов положительны. Даты и бюджет пока не заявлены.</p></div></div>`,
market:`<div class="card"><h2>Рынок: кому может быть нужен водород?</h2><p>Рынок не равен всему количеству домов Ирландии. Сначала нужно найти конкретную задачу, которую водород решает лучше альтернатив.</p></div><div class="grid"><div class="card"><h3>Промышленность</h3><p>Потенциальные потребители водорода как сырья или топлива. Важны постоянство поставок, качество и стоимость.</p></div><div class="card"><h3>Транспорт</h3><p>Отдельные тяжёлые транспортные применения, если они экономически оправданы по сравнению с прямой электрификацией.</p></div><div class="card"><h3>Энергетика</h3><p>Возможное длительное или сезонное хранение энергии, если аккумуляторы и другие решения не подходят.</p></div><div class="card"><h3>Газовое отопление домов</h3><p>Иллюстративный пример подмешивания. 20% H₂ по объёму — около 7% энергии смеси и ориентировочно 6–7% сокращения прямых выбросов CO₂ на единицу тепла. Нужны проверки оборудования и разрешения.</p></div></div><div class="card"><h3>От чего зависит цена продажи?</h3><p>Себестоимость водорода может формироваться независимо от цены газа, если используется электричество из ветра. Но покупатель сравнивает водород с другими видами топлива, поэтому рыночная цена продажи не становится автоматически независимой от газового рынка.</p></div>`,
prototype:`<div class="card"><h2>Как мог бы выглядеть исследовательский прототип</h2><p><strong>Ветрогенерация → доступная электроэнергия → электролизёр → очистка и хранение H₂ → подтверждённый потребитель.</strong></p><p>Приливная генерация рассматривается как потенциальное дополнительное направление. Аккумулятор BESS может помогать управлять режимами работы, но его необходимость должна быть доказана расчётом.</p></div><div class="grid"><div class="card"><h3>Что нужно измерять</h3><ul><li>Реальную цену и объём доступной электроэнергии</li><li>Часы работы и расход энергии на килограмм H₂</li><li>Затраты на воду, сжатие, хранение и обслуживание</li><li>Потери энергии и фактические выбросы</li></ul></div><div class="card"><h3>Чего пока нет</h3><ul><li>Подтверждённой площадки и схемы подключения</li><li>Согласованного инженерного проекта</li><li>Разрешений на водородную инфраструктуру</li><li>Подписанного договора продажи H₂</li></ul></div></div>`,
analytics:`<div class="card"><h2>Аналитика: почему важны не только дешёвые киловатт-часы</h2><p>Даже если электричество почти бесплатное, электролизёр нужно купить и обслуживать. Если он работает мало часов, стоимость оборудования приходится распределять на небольшое количество произведённого водорода.</p><p>Поэтому проверяем сразу три величины: <strong>цену электроэнергии, число рабочих часов и полную стоимость водорода</strong>.</p><div class="grid"><div class="result"><small>Электричество по €0,001/кВт·ч</small><div class="metric">€0,052/кг</div><small>Только электрическая составляющая при 52 кВт·ч/кг</small></div><div class="result"><small>Электричество по €0,01/кВт·ч</small><div class="metric">€0,52/кг</div><small>Только электрическая составляющая</small></div><div class="result"><small>Электричество по €0,04/кВт·ч</small><div class="metric">€2,08/кг</div><small>Только электрическая составляющая</small></div></div><p class="note">Это не итоговая себестоимость: капитальные и прочие расходы рассчитываются в калькуляторе. Нулевая или отрицательная оптовая цена также не означает нулевую стоимость поставки на объект.</p></div>`,
risks:`<div class="card"><h2>Главные риски и открытые вопросы</h2><ul><li><strong>Доступ к энергии:</strong> будет ли ограниченная ветровая генерация физически и юридически доступна для электролизёра?</li><li><strong>Цена:</strong> сможет ли проект покупать энергию по €0,001/кВт·ч с учётом договоров и сетевых платежей? Это гипотеза, не факт.</li><li><strong>Загрузка:</strong> достаточно ли часов в году для окупаемости оборудования?</li><li><strong>Спрос:</strong> кто купит водород и по какой цене?</li><li><strong>Инфраструктура:</strong> сколько стоят вода, сжатие, хранение, доставка и безопасность?</li><li><strong>Приливная энергетика:</strong> подтвердятся ли доступность ресурсов и конкурентоспособность технологии?</li><li><strong>Регулирование:</strong> какие разрешения необходимы для производства, хранения и возможного подмешивания?</li><li><strong>Альтернативы:</strong> не выгоднее ли прямое потребление электричества или аккумуляторы?</li></ul><p><strong>Вывод:</strong> проект остаётся открытой исследовательской гипотезой. Отрицательный результат расчётов — тоже полезный результат.</p></div>`,
research:`<div id="researchJournal"></div>`,
contact:`<div class="card"><div class="eyebrow">Автор проекта</div><h2>Контакты</h2><p><strong>Juri Ptitsin</strong> — автор и инициатор независимого исследовательского проекта <strong>Hydrogen Future Ireland</strong>.</p><p>Я изучаю возможности использования избыточной возобновляемой электроэнергии Ирландии для производства зелёного водорода, а также вопросы хранения энергии, экономики электролиза и энергетического перехода.</p><p>Открыт к профессиональному общению, обмену исследованиями и обсуждению идей в области возобновляемой энергетики и водородных технологий.</p><div class="contact-links"><a href="https://www.linkedin.com/in/juri-ptitsin-2a75713b7" target="_blank" rel="noopener noreferrer"><span>LinkedIn</span><strong>Juri Ptitsin ↗</strong></a><a href="mailto:gennadjevich0@gmail.com"><span>Email</span><strong>gennadjevich0@gmail.com ↗</strong></a><a href="tel:+353862445827"><span>Phone</span><strong>+353 86 244 5827 ↗</strong></a></div></div>`
},

subtitle:"An independent vision for Ireland's energy future: surplus wind electricity, possible tidal generation and green hydrogen.",
status:"Independent research concept — not a completed engineering design or investment offer.",
footer:"Independent concept. All calculations are scenarios.",
tabs:["Overview","Calculator","Roadmap","Market","Prototype","Analysis","Risks","Research","Contact"],
overview:`<div class="card highlight"><div class="eyebrow">Core vision</div><h2>Use available surplus renewable electricity rather than lose its potential value</h2><p>I propose exploring whether Ireland could convert some available surplus wind electricity into green hydrogen. In the longer term, tidal generation could be assessed as an additional source, subject to technical and economic feasibility.</p><p><strong>This is my vision of a possible energy system, not a claim that the system already exists or will necessarily be profitable.</strong></p></div><div class="grid"><div class="card"><h3>Wind</h3><p>Explore periods of curtailed wind output and low electricity prices. Curtailment does not automatically mean free or deliverable power.</p></div><div class="card"><h3>Tidal energy</h3><p>A possible additional research pathway requiring separate assessment of sites, technology, permits and costs.</p></div><div class="card"><h3>Electrolysis</h3><p>Convert electricity and treated water into hydrogen. Costs depend on electricity, operating hours, capital and maintenance.</p></div><div class="card"><h3>Applications</h3><p>Potential industrial, transport and energy uses. Domestic gas blending is one possible example, not the core business promise.</p></div></div><div class="card"><h2>What I am not claiming</h2><p>I am not claiming electricity is currently available at €0.001/kWh, that wind will monopolise Ireland's electricity market, that 20% H₂ blending is universally authorised, or that funding, contracts and buyers have been secured.</p><p><strong>The proposal:</strong> test future scenarios where wind generation grows and electricity becomes very cheap during certain hours, potentially supporting hydrogen production.</p></div>`,
calculator:`<div class="card"><h2>Hydrogen production cost calculator</h2><p>Adjust electricity prices, operating hours and equipment costs. Results estimate <strong>production cost</strong>, not a guaranteed selling price.</p><div class="grid"><label class="field">Electricity price, €/kWh<input id="price" type="number" min="0" max="1" step="0.001" value="0.001"></label><label class="field">Electrolyser hours/year<input id="hours" type="number" min="100" max="8760" step="100" value="3500"></label><label class="field">Electrolyser power, kW<input id="power" type="number" min="10" max="100000" step="100" value="1000"></label><label class="field">Electricity use, kWh/kg H₂<input id="specific" type="number" min="40" max="90" step="1" value="52"></label><label class="field">Installed CAPEX, €/kW<input id="capex" type="number" min="100" max="10000" step="100" value="2000"></label><label class="field">Fixed annual OPEX, % of CAPEX<input id="opex" type="number" min="0" max="20" step="0.5" value="4"></label><label class="field">Lifetime, years<input id="life" type="number" min="1" max="40" step="1" value="15"></label><label class="field">Discount rate, %<input id="rate" type="number" min="0" max="30" step="1" value="8"></label></div><p class="note">The initial €0.001/kWh is a hypothetical future-price scenario, not a verified market quote.</p><div id="results" class="grid" aria-live="polite"></div><p class="note">Excludes compression, storage, delivery, grid charges, taxes, water and replacement equipment. Actual costs may be higher.</p></div>`,
timeline:`<div class="card"><h2>Research roadmap — not fixed delivery dates</h2></div><div class="steps"><div class="card"><h3>Verify data</h3><p>Review hourly curtailment, electricity prices, nighttime periods and connection constraints. Nighttime does not guarantee surplus wind.</p></div><div class="card"><h3>Test economics</h3><p>Model power prices, operating hours, equipment cost and alternatives.</p></div><div class="card"><h3>Identify demand</h3><p>Ask potential customers about hydrogen specifications, volume and price.</p></div><div class="card"><h3>Engineering feasibility</h3><p>Assess site, partners, safety, permits and project economics.</p></div><div class="card"><h3>Pilot decision</h3><p>Consider a pilot only if earlier stages justify it. No dates or budget are promised.</p></div></div>`,
market:`<div class="card"><h2>Potential hydrogen markets</h2><p>Not every Irish home is automatically a hydrogen customer. The first task is to identify uses where hydrogen offers value over alternatives.</p></div><div class="grid"><div class="card"><h3>Industry</h3><p>Potential feedstock or fuel users, subject to supply reliability, quality and price.</p></div><div class="card"><h3>Transport</h3><p>Selected heavy transport applications where hydrogen can compete with electrification.</p></div><div class="card"><h3>Energy storage</h3><p>Potential long-duration or seasonal storage where alternatives are less suitable.</p></div><div class="card"><h3>Gas-heated homes</h3><p>An illustrative blending case only. A 20 vol% H₂ blend delivers about 7% of energy and roughly 6–7% lower direct CO₂ per unit of heat, subject to compatibility and approval.</p></div></div><div class="card"><h3>What sets selling prices?</h3><p>Production cost can be driven by wind electricity rather than natural gas. Selling prices still depend on customers, alternative fuels and the wider market.</p></div>`,
prototype:`<div class="card"><h2>Possible research prototype</h2><p><strong>Wind generation → available electricity → electrolyser → H₂ treatment and storage → confirmed customer.</strong></p><p>Tidal generation is a possible future research option. Battery storage (BESS) should be included only if the economics justify it.</p></div><div class="grid"><div class="card"><h3>Measurements</h3><ul><li>Actual electricity availability and cost</li><li>Operating hours and kWh/kg H₂</li><li>Water, compression, storage and maintenance</li><li>Energy losses and lifecycle emissions</li></ul></div><div class="card"><h3>Not yet established</h3><ul><li>Site and grid connection</li><li>Approved engineering design</li><li>Hydrogen safety permits</li><li>Binding H₂ offtake agreement</li></ul></div></div>`,
analytics:`<div class="card"><h2>Why cheap electricity is not enough</h2><p>Even with nearly free electricity, an electrolyser must be purchased and maintained. Fewer operating hours spread fixed costs across fewer kilograms of hydrogen.</p><div class="grid"><div class="result"><small>Power at €0.001/kWh</small><div class="metric">€0.052/kg</div><small>Electricity component only, at 52 kWh/kg</small></div><div class="result"><small>Power at €0.01/kWh</small><div class="metric">€0.52/kg</div><small>Electricity component only</small></div><div class="result"><small>Power at €0.04/kWh</small><div class="metric">€2.08/kg</div><small>Electricity component only</small></div></div><p class="note">These are not total production costs. The calculator includes simplified capital and operating costs. Zero or negative wholesale power prices do not guarantee zero delivery costs.</p></div>`,
risks:`<div class="card"><h2>Key risks and open questions</h2><ul><li><strong>Access:</strong> can curtailed wind energy be contracted and delivered to an electrolyser?</li><li><strong>Price:</strong> could €0.001/kWh be achieved after grid and contract costs? This is a hypothesis.</li><li><strong>Utilisation:</strong> will there be enough operating hours?</li><li><strong>Demand:</strong> who will buy hydrogen and at what price?</li><li><strong>Infrastructure:</strong> what will water, compression, storage, transport and safety cost?</li><li><strong>Tidal power:</strong> can it become technically and commercially viable?</li><li><strong>Regulation:</strong> what permits are required?</li><li><strong>Alternatives:</strong> could direct electrification or batteries perform better?</li></ul><p><strong>Conclusion:</strong> this is an open research hypothesis. An unfavourable calculation is still a useful finding.</p></div>`,
research:`<div id="researchJournal"></div>`,
contact:`<div class="card"><div class="eyebrow">Project author</div><h2>Contact</h2><p><strong>Juri Ptitsin</strong> — founder and independent researcher behind <strong>Hydrogen Future Ireland</strong>.</p><p>I explore how surplus renewable electricity in Ireland could support green hydrogen production, alongside energy storage, electrolyser economics and the wider energy transition.</p><p>I welcome professional conversations, research exchange and discussion of ideas in renewable energy and hydrogen technologies.</p><div class="contact-links"><a href="https://www.linkedin.com/in/juri-ptitsin-2a75713b7" target="_blank" rel="noopener noreferrer"><span>LinkedIn</span><strong>Juri Ptitsin ↗</strong></a><a href="mailto:gennadjevich0@gmail.com"><span>Email</span><strong>gennadjevich0@gmail.com ↗</strong></a><a href="tel:+353862445827"><span>Phone</span><strong>+353 86 244 5827 ↗</strong></a></div></div>`
}};

 title:{en:"Surplus wind power in Ireland: what must we establish first?",ru:"Избыточная ветровая энергия Ирландии: что нужно выяснить в первую очередь?"},
 excerpt:{en:"Why wind curtailment is not the same as electricity available for hydrogen production — and which evidence is missing.",ru:"Почему ограничения ветровой генерации не означают доступную электроэнергию для водорода и каких данных пока не хватает."},
 body:{en:[
 ["The research question","Ireland's wind resources make green hydrogen an interesting research possibility. But a promising resource is not the same as a commercially available electricity supply. Our first task is to establish whether surplus renewable electricity can be accessed at the right location, for enough hours, and at a viable delivered price."],
 ["Curtailment and constraints are different","Curtailment describes a reduction in renewable generation for system-wide operational reasons. Network constraints arise when a particular part of the transmission or distribution network cannot accommodate the available generation. These conditions have different implications for where an electrolyser might operate. An electrolyser cannot simply assume access to every megawatt-hour that was not generated."],
 ["Four questions that determine feasibility","First: what is the annual volume of curtailed or constrained wind generation? Second: at what hours and locations does it occur? Third: what would an electrolyser actually pay for delivered electricity, including relevant network and commercial costs? Fourth: how many operating hours would be available after accounting for the timing and location of supply?"],
 ["Why operating hours matter","An electrolyser has capital costs whether it runs frequently or rarely. Very cheap electricity can reduce the variable cost of hydrogen, but low utilisation spreads equipment costs across fewer kilograms. Both electricity price and operating hours must be modelled together."],
 ["What we can conclude today","This article establishes a research method, not a measured estimate of available surplus power or a proven hydrogen production cost. The next step is to extract and compare primary data, then publish the assumptions and calculations alongside the results."]
 ],ru:[
 ["Исследовательский вопрос","Ветровые ресурсы Ирландии делают производство зелёного водорода перспективной темой для исследования. Но наличие ветра ещё не означает наличие дешёвой электроэнергии, которую можно купить и доставить к электролизёру. Сначала необходимо выяснить, доступна ли избыточная энергия в нужном месте, в течение достаточного числа часов и по приемлемой полной цене."],
 ["Curtailment и constraint — не одно и то же","Curtailment — ограничение возобновляемой генерации по общесистемным причинам. Constraint — ограничение, связанное с пропускной способностью конкретного участка сети. Эти ситуации по-разному влияют на выбор площадки электролизёра. Нельзя считать, что вся невыработанная энергия автоматически доступна для производства водорода."],
 ["Четыре вопроса для проверки","Первый: каков годовой объём ограниченной ветровой генерации? Второй: в какие часы и в каких местах возникают ограничения? Третий: сколько реально будет стоить поставленная электроэнергия с учётом сетевых и коммерческих расходов? Четвёртый: сколько часов сможет работать электролизёр при таких условиях?"],
 ["Почему важны часы работы","Электролизёр требует капитальных вложений независимо от того, работает он часто или редко. Дешёвая электроэнергия уменьшает переменные затраты, но при малой загрузке стоимость оборудования распределяется на меньшее количество килограммов водорода. Поэтому цену электроэнергии и часы работы нужно рассчитывать вместе."],
 ["Что можно заключить сейчас","Эта статья описывает метод исследования, а не подтверждённый объём доступной энергии или доказанную себестоимость водорода. Следующий шаг — собрать первичные данные, сравнить их и опубликовать расчёты вместе с допущениями."]

function researchEscape(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function researchNavigate(id){

function renderResearch(){

 const ru=lang==="ru",local=k=>ru?k.ru:k.en;
 const dateFmt=d=>new Intl.DateTimeFormat(ru?"ru-RU":"en-IE",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(d+"T12:00:00Z"));

 if(selected){
  root.innerHTML='<button type="button" class="research-back" id="researchBack">← '+(ru?"Назад к статьям":"Back to articles")+'</button>'+
   '<article class="card research-story"><div class="eyebrow">'+dateFmt(selected.date)+' · '+researchEscape(local(RESEARCH_CATEGORIES.find(c=>c.id===selected.category)))+'</div>'+
   '<h2>'+researchEscape(local(selected.title))+'</h2><p class="research-lede">'+researchEscape(local(selected.excerpt))+'</p>'+
   local(selected.body).map(p=>'<section class="research-section"><h3>'+researchEscape(p[0])+'</h3><p>'+researchEscape(p[1])+'</p></section>').join('')+
   '<div class="research-sources"><h3>'+(ru?"Первоисточники и дополнительные материалы":"Sources & further reading")+'</h3><p class="note">'+(ru?"Ниже — официальные ресурсы для проверки темы. Эта вводная статья не приводит статистику из конкретных отчётов.":"Official resources for checking this topic are listed below. This introductory article does not claim statistics from specific reports.")+'</p>'+
   '<ol>'+selected.sources.map(src=>'<li><a href="'+researchEscape(src.url)+'" target="_blank" rel="noopener noreferrer">'+researchEscape(src.name)+' ↗</a><small>'+researchEscape(local(src.detail))+'</small></li>').join('')+'</ol></div></article>';
  document.getElementById("researchBack").onclick=()=>researchNavigate(null);
 }else{
  root.innerHTML='<div class="research-news-head"><div class="eyebrow">'+(ru?"Архив публикаций":"Publication archive")+'</div><h2>Research & Insights</h2><p>'+(ru?"Исследования энергетики Ирландии. Нажмите «Читать далее», чтобы открыть статью целиком.":"Research on Ireland’s energy future. Select “Read more” to open a complete article.")+'</p></div>'+
  '<div class="research-search"><label for="researchSearch">'+(ru?"Поиск по статьям":"Search articles")+'</label><div class="research-search-wrap"><span aria-hidden="true">⌕</span><input id="researchSearch" type="search" autocomplete="off" placeholder="'+(ru?"Например: ветер, водород, приливы…":"Try wind, hydrogen, tidal…")+'" value="'+researchEscape(researchQuery)+'"></div><div class="research-search-count" id="researchSearchCount" aria-live="polite"></div></div>'+
  '<div class="research-news-list" id="researchNewsList">'+ARTICLES.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>'<article class="card research-news-entry"><div class="research-news-date">'+dateFmt(a.date)+' <span>· '+researchEscape(local(RESEARCH_CATEGORIES.find(c=>c.id===a.category)))+'</span></div><h3><a href="#research/'+encodeURIComponent(a.id)+'" data-article="'+researchEscape(a.id)+'">'+researchEscape(local(a.title))+'</a></h3><p>'+researchEscape(local(a.excerpt))+'</p><a class="research-news-link" href="#research/'+encodeURIComponent(a.id)+'" data-article="'+researchEscape(a.id)+'">'+(ru?"Читать далее →":"Read more →")+'</a></article>').join('')+'</div>';
  const search=document.getElementById("researchSearch"),entries=[...root.querySelectorAll(".research-news-entry")];
  const normalize=v=>String(v).toLocaleLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").trim();
  function filterResearch(){
   researchQuery=search.value;const q=normalize(researchQuery);let visible=0;
   ARTICLES.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach((a,i)=>{
    const cat=RESEARCH_CATEGORIES.find(c=>c.id===a.category);
    const content=[a.date,a.title.en,a.title.ru,a.excerpt.en,a.excerpt.ru,cat.en,cat.ru,...a.body.en.flat(),...a.body.ru.flat()].join(" ");
    const match=!q||normalize(content).includes(q);entries[i].hidden=!match;if(match)visible++;
   });
   document.getElementById("researchSearchCount").textContent=q?(ru?"Найдено статей: ":"Articles found: ")+visible:"";
   let empty=root.querySelector(".research-no-results");
   if(!visible){if(!empty){empty=document.createElement("p");empty.className="research-no-results";document.getElementById("researchNewsList").after(empty)}empty.textContent=ru?"Ничего не найдено. Попробуйте другое слово.":"No matching articles. Try another keyword."}else if(empty)empty.remove();
  }
  search.addEventListener("input",filterResearch);filterResearch();
  root.querySelectorAll('[data-article]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();researchNavigate(a.dataset.article)}));
 }
}

const OVERVIEW_DETAILS={"en":[["Wind energy","Ireland has significant wind resources, but electricity production varies with weather and does not always match demand or network capacity. The key research question is whether low-priced or otherwise unused wind electricity can be delivered to an electrolyser reliably and economically.","Research priorities: hourly wind generation, curtailment and constraints, electricity prices, grid access and usable operating hours."],["Tidal energy","Tidal-stream turbines generate electricity from moving seawater. Tidal flows are predictable, but deployment requires suitable sites, marine engineering, environmental assessment and network connections. This remains a possible future research pathway, not an existing part of the project.","Research priorities: Irish tidal resources, technology readiness, marine permissions, environmental impacts and generation costs."],["Electrolysis","An electrolyser splits treated water into hydrogen and oxygen using electricity. The cost per kilogram depends on equipment costs, efficiency, operating hours, maintenance and electricity delivery. Hydrogen may also require compression, storage and transport.","Research priorities: electricity use per kilogram, capital expenditure, operating costs, utilisation and delivered hydrogen cost."],["Applications","Hydrogen may have value in selected industrial processes, difficult-to-electrify transport and long-duration energy storage. Each application needs a real customer and comparison with alternatives. Hydrogen blending into gas networks is a separate technical and regulatory question.","Research priorities: credible demand, infrastructure, safety, transport and storage costs, and relevant approvals."]],"ru":[["Ветровая энергетика","В Ирландии значительные ветровые ресурсы, но выработка зависит от погоды и не всегда совпадает с потреблением и возможностями сети. Главный вопрос — можно ли доставлять дешёвую или неиспользованную ветровую электроэнергию к электролизёру на экономически оправданных условиях.","Что исследуем: почасовую генерацию, ограничения сети, цены электричества, доступ к сети и возможные часы работы."],["Приливная энергетика","Приливные турбины используют движение морской воды. Приливы предсказуемы, однако необходимы подходящие площадки, морские инженерные решения, экологическая оценка и подключение к сети. Это возможное будущее направление исследования, а не готовая часть проекта.","Что исследуем: приливные ресурсы Ирландии, зрелость технологий, разрешения, воздействие на природу и стоимость генерации."],["Электролиз","Электролизёр использует электричество для разделения очищенной воды на водород и кислород. Стоимость килограмма зависит от оборудования, эффективности, числа рабочих часов, обслуживания и доставки электричества. Водород также может требовать сжатия, хранения и транспортировки.","Что исследуем: расход электричества на килограмм, капитальные и эксплуатационные затраты, загрузку и стоимость доставки водорода."],["Применение","Водород может быть полезен в отдельных промышленных процессах, сложных для электрификации видах транспорта и длительном хранении энергии. Для каждого применения необходим реальный потребитель и сравнение с альтернативами. Подмешивание водорода в газовую сеть — отдельный технический и нормативный вопрос.","Что исследуем: реальный спрос, инфраструктуру, безопасность, стоимость хранения и перевозки, необходимые разрешения."]]};

 });
}
function render(){document.documentElement.lang=lang;const t=L[lang];document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);document.getElementById('enBtn').setAttribute('aria-pressed',lang==='en');document.getElementById('ruBtn').setAttribute('aria-pressed',lang==='ru');document.querySelectorAll('[data-language]').forEach(b=>{const selected=b.dataset.language===lang;b.setAttribute('aria-pressed',String(selected));b.classList.toggle('selected',selected)});document.getElementById('tabs').innerHTML=ids.map((id,i)=>'<button type="button" data-tab="'+id+'" role="tab" aria-selected="'+(active===id)+'">'+t.tabs[i]+'</button>').join('');ids.forEach(id=>{const p=document.getElementById(id);p.innerHTML=t[id];p.classList.toggle('active',id===active)});document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render();document.getElementById(active).scrollIntoView({block:'start',behavior:'smooth'})}));if(active==='calculator'){document.querySelectorAll('#calculator input').forEach(i=>i.addEventListener('input',calculate));calculate()}visualExtras();setupOverview();overviewMiniChart();renderResearch()}

function visualExtras(){
 const overview=document.getElementById('overview');
 if(overview && !overview.querySelector('.viz-shell')){
  const isRu=lang==='ru';
  const flow=document.createElement('div');flow.className='viz-shell';
  flow.innerHTML='<div class="eyebrow" style="color:#8fe1d4">'+(isRu?'КОНЦЕПЦИЯ В ЧЕТЫРЁХ ШАГАХ':'THE IDEA IN FOUR STEPS')+'</div><h2>'+(isRu?'От возобновляемой энергии к водороду':'From renewable electricity to hydrogen')+'</h2><p>'+(isRu?'Иллюстрация возможной системы — не готовая схема установки.':'An illustrative system, not an approved engineering design.')+'</p><div class="viz-flow">'+(isRu?[
 ['🌬️','Ветер и приливы','Потенциальные источники'],['⚡','Доступная энергия','Цена и часы поставки'],['💧','Электролиз','Производство H₂'],['🏭','Потребитель','Подтверждённый спрос']
 ]:[['🌬️','Wind and tides','Potential sources'],['⚡','Available power','Price and hours'],['💧','Electrolysis','Hydrogen production'],['🏭','Customer','Verified demand']]).map(a=>'<div class="viz-node"><span class="viz-symbol">'+a[0]+'</span><b>'+a[1]+'</b><small>'+a[2]+'</small></div>').join('')+'</div>';
  const cards=overview.querySelectorAll('.card');if(cards.length>0)cards[0].after(flow);else overview.prepend(flow);
 }
 const analytics=document.getElementById('analytics');
 if(analytics && !analytics.querySelector('.chart-wrap')){
  const box=document.createElement('div');box.className='card';box.innerHTML='<h2>'+(lang==='ru'?'График: как часы работы влияют на себестоимость':'Chart: how operating hours affect hydrogen cost')+'</h2><p>'+(lang==='ru'?'Сравнение при двух условных ценах электричества. Модель: 1 МВт, €2 млн инвестиций, 52 кВт·ч/кг, 15 лет, 8%, обслуживание 4% в год.':'Two illustrative electricity price scenarios. Model: 1 MW, €2m CAPEX, 52 kWh/kg, 15 years, 8% discount rate, 4% fixed OPEX.')+'</p><div class="chart-wrap" id="cost-chart"></div><div class="chart-legend"><span>€0.001/kWh</span><span>€0.04/kWh</span></div><p class="note">'+(lang==='ru'?'Это расчётные сценарии, не рыночные котировки и не прогноз.':'Illustrative scenarios, not market quotations or forecasts.')+'</p>';analytics.appendChild(box);
  const crf=.08/(1-Math.pow(1.08,-15)),fixed=2000000*(crf+.04),hrs=[1000,2000,3000,4000,5000,6000,7000,8000],cost=(h,p)=>p*52+fixed/(1000*h/52),W=760,H=310,left=56,right=20,top=22,bottom=47,maxY=20,px=i=>left+i*(W-left-right)/7,py=v=>top+(maxY-v)/maxY*(H-top-bottom);
  const lines=[0,5,10,15,20].map(v=>'<line x1="'+left+'" y1="'+py(v)+'" x2="'+(W-right)+'" y2="'+py(v)+'" stroke="#d7e6ea"/><text x="'+(left-12)+'" y="'+(py(v)+4)+'" font-size="12" fill="#66808c" text-anchor="end">'+v+'</text>').join('');
  const xlabels=hrs.map((v,i)=>'<text x="'+px(i)+'" y="'+(H-16)+'" text-anchor="middle" font-size="12" fill="#66808c">'+(v/1000)+'k</text>').join('');
  const paths=[['#0b8b82',.001],['#e3a650',.04]].map(([color,p])=>'<polyline points="'+hrs.map((h,i)=>px(i)+','+py(cost(h,p))).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>'+hrs.map((h,i)=>'<circle cx="'+px(i)+'" cy="'+py(cost(h,p))+'" r="4" fill="'+color+'"/>').join('')).join('');
  document.getElementById('cost-chart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(lang==='ru'?'Себестоимость водорода снижается при увеличении часов работы электролизёра':'Hydrogen cost falls as electrolyser utilisation rises')+'"><text x="12" y="16" fill="#55737c" font-size="12">€/kg H₂</text>'+lines+xlabels+paths+'<text x="'+(W/2)+'" y="'+(H-1)+'" text-anchor="middle" font-size="12" fill="#55737c">'+(lang==='ru'?'Часов работы в год':'Operating hours per year')+'</text></svg>';
 }
}

function calculate(){const n=id=>Number(document.getElementById(id).value);const price=n('price'),hours=n('hours'),power=n('power'),spec=n('specific'),capex=n('capex'),opex=n('opex'),life=n('life'),rate=n('rate')/100;const ok=[price,hours,power,spec,capex,opex,life,rate].every(Number.isFinite)&&price>=0&&hours>0&&hours<=8760&&power>0&&spec>0&&capex>=0&&opex>=0&&life>0&&rate>=0;if(!ok){document.getElementById('results').textContent=lang==='ru'?'Проверь введённые значения.':'Please check input values.';return}const kg=power*hours/spec,investment=power*capex,crf=rate===0?1/life:rate/(1-Math.pow(1+rate,-life)),fixed=investment*(crf+opex/100),elec=price*spec,total=elec+fixed/kg;const nf=(v,d=2)=>new Intl.NumberFormat(lang==='ru'?'ru-RU':'en-IE',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);const labels=lang==='ru'?[['Производство H₂, тонн/год',kg/1000],['Электричество, €/кг',elec],['Оборудование и обслуживание, €/кг',fixed/kg],['Расчётная себестоимость, €/кг',total]]:[['H₂ production, tonnes/year',kg/1000],['Electricity, €/kg',elec],['Capital and fixed costs, €/kg',fixed/kg],['Estimated production cost, €/kg',total]];document.getElementById('results').innerHTML=labels.map(([k,v])=>'<div class="result"><small>'+k+'</small><div class="metric">'+nf(v)+'</div></div>').join('')}
function switchLanguage(next){if(next!=='ru'&&next!=='en')return;lang=next;try{localStorage.setItem('hfi-language',next)}catch(e){}render()}
document.getElementById('enBtn').addEventListener('click',()=>switchLanguage('en'));document.getElementById('ruBtn').addEventListener('click',()=>switchLanguage('ru'));document.querySelectorAll('[data-language]').forEach(b=>b.addEventListener('click',()=>switchLanguage(b.dataset.language)));try{const saved=localStorage.getItem('hfi-language');if(saved==='ru'||saved==='en')lang=saved}catch(e){}render();
</script></body></html>
